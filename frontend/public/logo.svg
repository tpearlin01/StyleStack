<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Silver-White Luxury Gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#D1D5DB" />
    </linearGradient>
    
    <!-- Rose Metallic Accent Gradient -->
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Subtle Glow Shadow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Luxury Backdrop Circle -->
  <rect width="500" height="500" rx="100" fill="#0F172A" />

  <!-- Monogram Group (Overlapping Cursive Script P & R) -->
  <g transform="translate(40, 30)" filter="url(#glow)">
    
    <!-- Outer Decorative Ring Motif -->
    <circle cx="210" cy="220" r="190" fill="none" stroke="url(#roseAccent)" stroke-width="3" stroke-dasharray="8 6" opacity="0.4" />
    <circle cx="210" cy="220" r="175" fill="none" stroke="url(#silverGradient)" stroke-width="1.5" opacity="0.6" />

    <!-- Overlapping Cursive 'P' (Princel) -->
    <path d="M 120 330 
             C 120 280, 150 130, 165 100 
             C 175 80, 195 70, 230 70 
             C 285 70, 320 100, 320 145 
             C 320 195, 270 220, 205 220 
             L 155 220 
             C 145 250, 130 310, 125 330" 
          fill="none" 
          stroke="url(#silverGradient)" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Overlapping Cursive 'R' Intertwined (Pearlin) -->
    <path d="M 185 330 
             C 195 290, 215 210, 225 170 
             C 235 130, 255 120, 280 120 
             C 325 120, 350 145, 350 180 
             C 350 220, 310 240, 260 240 
             C 240 240, 220 235, 210 230 
             L 280 330" 
          fill="none" 
          stroke="url(#roseAccent)" 
          stroke-width="20" 
          stroke-linecap="round" 
          stroke-linejoin="round" 
          opacity="0.9" />

    <!-- Swash Flourish Details -->
    <path d="M 90 280 C 140 330, 240 350, 330 320" 
          fill="none" 
          stroke="url(#silverGradient)" 
          stroke-width="8" 
          stroke-linecap="round" />

    <!-- Diamond Accent Sparkle -->
    <polygon points="210,50 216,65 230,71 216,77 210,92 204,77 190,71 204,65" fill="#FB7185" />
    <polygon points="340,300 344,310 355,314 344,318 340,328 336,318 325,314 336,310" fill="#F3F4F6" />
  </g>
</svg>
